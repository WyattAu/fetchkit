[package]
name = "fetchkit"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Resilient HTTP client for Rust — retry, circuit breaker, connection pooling, and typed JSON helpers built on reqwest"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/fetchkit"
keywords = ["http", "reqwest", "retry", "circuit-breaker", "resilient"]
categories = ["network-programming", "web-programming"]
exclude = ["/target"]

[dependencies]
reqwest = { version = "0.12", default-features = false }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.7"
serde = "1"
serde_json = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"
anyhow = "1"

breaker = { version = "1", git = "https://github.com/WyattAu/breaker", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }


[features]
default = ["json", "rustls-tls"]
json = ["reqwest/json"]
multipart = ["reqwest/multipart"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
circuit-breaker = ["dep:breaker"]

[[bench]]
name = "fetch_bench"
harness = false
